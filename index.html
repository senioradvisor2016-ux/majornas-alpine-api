<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎿 Majora Alpine - På Vift i Lift</title>
  <style>
    :root {
      --bg: #0f1729;
      --card: #1a2744;
      --accent: #3b82f6;
      --snow: #e0f2fe;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f97316;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container { max-width: 800px; margin: 0 auto; }
    
    header {
      text-align: center;
      padding: 30px 0;
      border-bottom: 1px solid var(--card);
      margin-bottom: 30px;
    }
    
    h1 {
      font-size: 2.5rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--snow), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .tagline { color: var(--muted); font-style: italic; }
    
    .status-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    
    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--card);
      border-radius: 20px;
      font-size: 0.9rem;
    }
    
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    .status-dot.open { background: var(--green); }
    .status-dot.alert { background: var(--orange); }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    
    .card-icon { font-size: 2rem; margin-bottom: 12px; }
    .card-value { font-size: 2rem; font-weight: bold; margin-bottom: 4px; }
    .card-label { color: var(--muted); font-size: 0.9rem; }
    .card-sub { color: var(--muted); font-size: 0.8rem; margin-top: 8px; }
    
    .lifts-section { margin-bottom: 30px; }
    
    .section-title {
      font-size: 1.2rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .lift-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }
    
    .lift-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--card);
      border-radius: 10px;
      font-size: 0.85rem;
    }
    
    .lift-item.closed { opacity: 0.5; }
    .lift-status { font-size: 1.2rem; }
    
    .ai-box {
      background: linear-gradient(135deg, var(--card), #1e3a5f);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
      border: 1px solid var(--accent);
    }
    
    .ai-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .ai-icon { font-size: 1.5rem; }
    .ai-title { font-weight: 600; }
    
    .ai-input-wrap {
      display: flex;
      gap: 10px;
    }
    
    .ai-input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    
    .ai-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    .ai-btn {
      padding: 14px 24px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .ai-btn:hover { background: #2563eb; }
    
    .ai-response {
      margin-top: 16px;
      padding: 16px;
      background: var(--bg);
      border-radius: 12px;
      display: none;
      line-height: 1.6;
    }
    
    .ai-response.visible { display: block; }
    
    .recommendation {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
    }
    
    .rec-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .rec-content { line-height: 1.6; }
    .rec-highlight { color: var(--accent); font-weight: 600; }
    
    .slopes-breakdown {
      display: flex;
      gap: 16px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    
    .slope-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    
    .slope-badge.green { background: #166534; }
    .slope-badge.blue { background: #1d4ed8; }
    .slope-badge.red { background: #b91c1c; }
    .slope-badge.black { background: #1f2937; border: 1px solid #374151; }
    
    .forecast {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
    }
    
    .forecast-days {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
    }
    
    .forecast-day {
      flex: 0 0 100px;
      text-align: center;
      padding: 16px;
      background: var(--bg);
      border-radius: 12px;
    }
    
    .forecast-day-name { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; }
    .forecast-day-icon { font-size: 2rem; margin-bottom: 8px; }
    .forecast-day-temp { font-weight: 600; }
    
    .last-updated {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--card);
    }
    
    .powder-alert {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #1f2937;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 30px;
      animation: glow 2s infinite;
    }
    
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }
      50% { box-shadow: 0 0 40px rgba(251, 191, 36, 0.8); }
    }
    
    .powder-alert h2 { font-size: 1.5rem; margin-bottom: 8px; }
    .powder-alert.hidden { display: none; }
    
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--card);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎿 Majora Alpine</h1>
      <p class="tagline">På Vift i Lift</p>
      <div class="status-bar">
        <div class="status-item">
          <div class="status-dot open"></div>
          <span id="resort-status">Laddar...</span>
        </div>
        <div class="status-item">
          <span>📍</span>
          <span id="resort-name">Trysil</span>
        </div>
      </div>
    </header>
    
    <div id="powder-alert" class="powder-alert hidden">
      <h2>❄️ POWDER ALERT! ❄️</h2>
      <p id="powder-text"></p>
    </div>
    
    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
      </div>
    </div>
  </div>
  
  <script>
    const API_URL = 'https://api.fnugg.no/search?q=trysil';
    
    async function fetchData() {
      const res = await fetch(API_URL);
      const data = await res.json();
      return data.hits.hits.find(h => h._source.name === 'SkiStar Trysil')?._source;
    }
    
    function getWeatherIcon(symbolName) {
      const icons = {
        'Sun': '☀️', 'LightCloud': '🌤️', 'PartlyCloud': '⛅',
        'Cloud': '☁️', 'LightRain': '🌧️', 'Rain': '🌧️',
        'LightSnow': '🌨️', 'Snow': '❄️', 'Fog': '🌫️'
      };
      return icons[symbolName] || '🌤️';
    }
    
    function getDayName(date) {
      const days = ['Sön', 'Mån', 'Tis', 'Ons', 'Tor', 'Fre', 'Lör'];
      return days[new Date(date).getDay()];
    }
    
    function getAIRecommendation(data) {
      const cond = data.conditions.combined.top;
      const temp = cond.temperature.value;
      const wind = cond.wind.mps;
      const snow = cond.snow.depth_slope;
      const fresh = cond.snow.today || 0;
      
      let rec = '';
      let highlight = '';
      
      if (fresh >= 10) {
        rec = `🎿 POWDER DAY! ${fresh}cm nysnö - kör offpist på Høgegga eller Høyfjellssenteret!`;
        highlight = 'Svarta backar rekommenderas';
      } else if (temp <= -10 && wind <= 3) {
        rec = `Perfekta förhållanden! Kall, klar dag med minimal vind. Snön är snabb och fin.`;
        highlight = 'Alla backar rekommenderas';
      } else if (temp <= -5) {
        rec = `Bra vinterdag! Snön håller sig fin. `;
        if (wind > 5) {
          rec += `Lite blåsigt på toppen - håll dig i lägre partier.`;
          highlight = 'Turistsenteret rekommenderas';
        } else {
          highlight = 'Kör på toppen!';
        }
      } else if (temp > 0) {
        rec = `Plusgrader idag - snön blir blöt. Kör tidigt på morgonen för bäst före!`;
        highlight = 'Morgonåkning rekommenderas';
      } else {
        rec = `Standard vinterdag. Fint i backarna!`;
        highlight = 'Alla backar öppna';
      }
      
      return { text: rec, highlight };
    }
    
    function getSlopesByDifficulty(slopes) {
      const open = slopes.list.filter(s => s.status === '1');
      return {
        green: open.filter(s => s.slope_difficulty === 'green').length,
        blue: open.filter(s => s.slope_difficulty === 'blue').length,
        red: open.filter(s => s.slope_difficulty === 'red').length,
        black: open.filter(s => s.slope_difficulty === 'black').length
      };
    }
    
    async function render() {
      const data = await fetchData();
      if (!data) {
        document.getElementById('content').innerHTML = '<p>Kunde inte ladda data</p>';
        return;
      }
      
      const cond = data.conditions.combined;
      const top = cond.top || {};
      const bottom = cond.bottom || top;
      const forecast = data.conditions.forecast;
      const slopeStats = getSlopesByDifficulty(data.slopes);
      const rec = getAIRecommendation(data);
      
      // Status
      document.getElementById('resort-status').textContent = 
        data.resort_open ? 'Öppet' : 'Stängt';
      
      // Powder alert
      if (top.powder_alarm || (top.snow?.today || 0) >= 10) {
        document.getElementById('powder-alert').classList.remove('hidden');
        document.getElementById('powder-text').textContent = 
          `${top.snow?.today || 0}cm nysnö! ${top.condition_description}`;
      }
      
      // Main content
      document.getElementById('content').innerHTML = `
        <div class="recommendation">
          <div class="rec-header">
            <span style="font-size:1.5rem">🤖</span>
            <span style="font-weight:600">AI Rekommendation</span>
          </div>
          <p class="rec-content">${rec.text}</p>
          <p class="rec-highlight" style="margin-top:12px">→ ${rec.highlight}</p>
        </div>
        
        <div class="grid">
          <div class="card">
            <div class="card-icon">🚡</div>
            <div class="card-value">${data.lifts.open}/${data.lifts.count}</div>
            <div class="card-label">Liftar öppna</div>
          </div>
          <div class="card">
            <div class="card-icon">⛷️</div>
            <div class="card-value">${data.slopes.open}/${data.slopes.count}</div>
            <div class="card-label">Backar öppna</div>
            <div class="slopes-breakdown">
              <span class="slope-badge green">🟢 ${slopeStats.green}</span>
              <span class="slope-badge blue">🔵 ${slopeStats.blue}</span>
              <span class="slope-badge red">🔴 ${slopeStats.red}</span>
              <span class="slope-badge black">⚫ ${slopeStats.black}</span>
            </div>
          </div>
          <div class="card">
            <div class="card-icon">❄️</div>
            <div class="card-value">${top.snow?.depth_slope || 0}cm</div>
            <div class="card-label">Snödjup (topp)</div>
            <div class="card-sub">Dal: ${bottom.snow?.depth_slope || 0}cm</div>
          </div>
          <div class="card">
            <div class="card-icon">🌡️</div>
            <div class="card-value">${top.temperature?.value || 0}°C</div>
            <div class="card-label">Temperatur (topp)</div>
            <div class="card-sub">Dal: ${bottom.temperature?.value || 0}°C</div>
          </div>
          <div class="card">
            <div class="card-icon">💨</div>
            <div class="card-value">${top.wind?.mps || 0} m/s</div>
            <div class="card-label">Vind</div>
            <div class="card-sub">${top.wind?.name || ''}</div>
          </div>
          <div class="card">
            <div class="card-icon">📊</div>
            <div class="card-value" style="font-size:1rem">${top.condition_description || ''}</div>
            <div class="card-label">Föreförhållanden</div>
          </div>
        </div>
        
        <div class="ai-box">
          <div class="ai-header">
            <span class="ai-icon">🤖</span>
            <span class="ai-title">Fråga Majora AI</span>
          </div>
          <div class="ai-input-wrap">
            <input type="text" class="ai-input" id="ai-input" 
              placeholder="T.ex. 'Vilken lift har kortast kö?' eller 'Bästa backen för barn?'">
            <button class="ai-btn" onclick="askAI()">Fråga</button>
          </div>
          <div class="ai-response" id="ai-response"></div>
        </div>
        
        <div class="lifts-section">
          <h2 class="section-title">🚡 Liftstatus</h2>
          <div class="lift-grid">
            ${data.lifts.list.map(lift => `
              <div class="lift-item ${lift.status === '0' ? 'closed' : ''}">
                <span class="lift-status">${lift.status === '1' ? '✅' : '❌'}</span>
                <span>${lift.name}</span>
              </div>
            `).join('')}
          </div>
        </div>
        
        <div class="forecast">
          <h2 class="section-title">📅 Prognos</h2>
          <div class="forecast-days">
            <div class="forecast-day">
              <div class="forecast-day-name">Idag</div>
              <div class="forecast-day-icon">${getWeatherIcon(forecast.today?.top?.symbol?.name)}</div>
              <div class="forecast-day-temp">${forecast.today?.top?.temperature?.value || '-'}°C</div>
            </div>
            ${forecast.long_term?.slice(0, 5).map(day => `
              <div class="forecast-day">
                <div class="forecast-day-name">${getDayName(day.period.from)}</div>
                <div class="forecast-day-icon">${getWeatherIcon(day.symbol?.name)}</div>
                <div class="forecast-day-temp">${day.temperature?.value || '-'}°C</div>
              </div>
            `).join('') || ''}
          </div>
        </div>
        
        <div class="last-updated">
          Uppdaterad: ${new Date(data.last_updated).toLocaleString('sv-SE')}
        </div>
      `;
    }
    
    // Simulerad AI-frågor (kan kopplas till riktig backend)
    function askAI() {
      const input = document.getElementById('ai-input').value.toLowerCase();
      const response = document.getElementById('ai-response');
      
      let answer = '';
      
      if (input.includes('kö') || input.includes('vänta')) {
        answer = '🎯 Baserat på tid på dagen och lifttyp: <b>Trysilgondolen</b> har ofta kortast kö på förmiddagen. Undvik T1 Liekspressen runt lunch. Tips: Kör via Høyfjellssenteret för mindre trängsel!';
      } else if (input.includes('barn') || input.includes('familj') || input.includes('nybörjar')) {
        answer = '👨‍👩‍👧 För familjer: <b>Eventyr-området</b> på Turistsenteret är perfekt! Gröna backar 21, 39, 56, 60 är bäst för barn. Undvik Høgegga - för branta backar där.';
      } else if (input.includes('svart') || input.includes('avancerad') || input.includes('expert')) {
        answer = '⚫ För experter: <b>Høgegga-sidan</b> har de bästa svarta backarna. Backe 30, 76, 82 är favoriter. Just nu är 69, 70, 75, 80 stängda - kolla innan du åker!';
      } else if (input.includes('lunch') || input.includes('äta') || input.includes('mat')) {
        answer = '🍕 Lunchställen: <b>Knettsetra</b> vid T8-liften har bäst utsikt. Fjellekspressen Lodge vid T2 för snabb lunch. Undvik Turistsenteret-restaurangen 12-13 (rusning).';
      } else if (input.includes('väder') || input.includes('vind') || input.includes('prognos')) {
        answer = '🌤️ Kommande dagar ser bra ut! Stabilt kallt väder (-8 till -13°C), minimal nederbörd. Lite molnigare i mitten av veckan men fortfarande bra skidväder.';
      } else if (input.includes('parkering') || input.includes('parkera')) {
        answer = '🅿️ Parkering: <b>Turistsenteret P1</b> fylls först - kom före 09:00. Høyfjellssenteret har ofta lediga platser. Skihytta är bra alternativ på helger.';
      } else {
        answer = '🤔 Jag förstår inte riktigt frågan. Prova fråga om: köer, barnvänliga backar, svarta backar, lunchställen, väder eller parkering!';
      }
      
      response.innerHTML = answer;
      response.classList.add('visible');
    }
    
    // Enter för att skicka
    document.addEventListener('DOMContentLoaded', () => {
      render();
      
      // Refresh var 5:e minut
      setInterval(render, 5 * 60 * 1000);
    });
    
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && document.activeElement.id === 'ai-input') {
        askAI();
      }
    });
  </script>
</body>
</html>
